<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e0e7ff" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="night" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050512" />
      <stop offset="50%" stop-color="#0c0b2b" />
      <stop offset="100%" stop-color="#18164b" />
    </linearGradient>
  </defs>
  <rect width="600" height="700" fill="url(#night)" />
  <!-- Glowing Moon -->
  <circle cx="440" cy="160" r="90" fill="url(#moonGlow)" />
  <circle cx="440" cy="160" r="45" fill="#f8fafc" />
  <!-- Starlight Constellation spelling A & T -->
  <g stroke="#c7d2fe" stroke-width="1.5" fill="#fff" opacity="0.85">
    <line x1="120" y1="200" x2="160" y2="130" />
    <line x1="160" y1="130" x2="200" y2="200" />
    <line x1="140" y1="170" x2="180" y2="170" />
    
    <circle cx="120" cy="200" r="3.5" fill="#ff80bf" />
    <circle cx="160" cy="130" r="4" fill="#ff80bf" />
    <circle cx="200" cy="200" r="3.5" fill="#ff80bf" />
    
    <!-- Heart Link -->
    <path d="M220 160 Q 235 145 250 160 Q 235 180 220 160" fill="#f43f5e" stroke="none" />
    
    <line x1="270" y1="140" x2="330" y2="140" />
    <line x1="300" y1="140" x2="300" y2="210" />
    <circle cx="270" cy="140" r="3.5" fill="#38bdf8" />
    <circle cx="330" cy="140" r="3.5" fill="#38bdf8" />
    <circle cx="300" cy="210" r="4" fill="#38bdf8" />
  </g>
  <!-- Grassy Hill with Stargazers -->
  <path d="M-20 520 Q 250 460 620 540 L 620 720 L -20 720 Z" fill="#070a14" />
  <!-- Sitting couple looking up -->
  <g transform="translate(220, 480)" fill="#04060c">
    <circle cx="40" cy="25" r="12" />
    <circle cx="68" cy="28" r="11" />
    <path d="M28 38 C28 38 52 35 52 50 L48 85 L25 85 Z" />
    <path d="M54 39 C54 39 80 37 80 52 L75 85 L52 85 Z" />
  </g>
</svg>