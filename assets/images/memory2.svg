<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="sky2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1322" />
      <stop offset="50%" stop-color="#18233c" />
      <stop offset="100%" stop-color="#283556" />
    </linearGradient>
    <radialGradient id="bulb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffde7" />
      <stop offset="40%" stop-color="#ffd54f" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffb300" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="700" fill="url(#sky2)" />
  <!-- Fairy Light Strings -->
  <path d="M-20 80 Q 150 180 300 110 T 620 120" fill="none" stroke="#546e7a" stroke-width="2" />
  <path d="M-20 160 Q 200 240 400 180 T 620 220" fill="none" stroke="#546e7a" stroke-width="2" />
  <!-- Bulbs -->
  <circle cx="80" cy="130" r="16" fill="url(#bulb)" />
  <circle cx="190" cy="155" r="20" fill="url(#bulb)" />
  <circle cx="310" cy="112" r="18" fill="url(#bulb)" />
  <circle cx="440" cy="115" r="19" fill="url(#bulb)" />
  <circle cx="540" cy="135" r="15" fill="url(#bulb)" />
  
  <circle cx="60" cy="195" r="17" fill="url(#bulb)" />
  <circle cx="180" cy="225" r="22" fill="url(#bulb)" />
  <circle cx="320" cy="205" r="19" fill="url(#bulb)" />
  <circle cx="470" cy="195" r="21" fill="url(#bulb)" />
  <!-- Cafe Window Frame & Glow -->
  <rect x="80" y="280" width="440" height="350" rx="20" fill="#11192b" stroke="#2c3e66" stroke-width="4" />
  <circle cx="300" cy="440" r="100" fill="#ffd54f" opacity="0.15" />
  <!-- Two Coffee Cups Steaming -->
  <g transform="translate(240, 480)">
    <rect x="10" y="30" width="35" height="45" rx="6" fill="#fce4ec" />
    <path d="M45 40 Q 55 45 45 60" stroke="#fce4ec" stroke-width="4" fill="none" />
    <rect x="65" y="30" width="35" height="45" rx="6" fill="#e1bee7" />
    <path d="M65 40 Q 55 45 65 60" stroke="#e1bee7" stroke-width="4" fill="none" />
    <!-- Steam Heart -->
    <path d="M 55 15 C 55 8 47 4 41 9 C 35 4 27 8 27 15 C 27 24 41 29 41 29 C 41 29 55 24 55 15 Z" fill="#f48fb1" opacity="0.8" />
  </g>
</svg>